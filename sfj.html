<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحساب الشخصي - نادي اوتك</title>
    <!-- استدعاء خط Cairo الرسمي الفخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-sky: #0284c7;
            --light-sky: #e0f2fe;
            --deep-sky: #0369a1;
            --pure-white: #ffffff;
            --soft-bg: #f8fafc;
            --text-color: #0f172a;
            --border-sky: #bae6fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--soft-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 90px; /* مساحة للشريط السفلي بالجوال */
        }

        .account-container {
            background-color: var(--pure-white);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.08);
            border: 1px solid var(--border-sky);
            width: 100%;
            max-width: 550px;
            padding: 40px;
        }

        /* رأس الصفحة */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-sky);
            padding-bottom: 20px;
        }

        .page-header h1 {
            font-size: 1.5rem;
            color: var(--deep-sky);
            font-weight: 700;
        }

        .btn-back {
            background-color: var(--light-sky);
            color: var(--primary-sky);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: var(--primary-sky);
            color: var(--pure-white);
        }

        /* بطاقة بيانات الحساب */
        .info-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--soft-bg);
            border: 1px solid var(--border-sky);
            border-radius: 12px;
            transition: transform 0.2s ease;
        }

        .info-row:hover {
            border-color: var(--primary-sky);
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.05rem;
            color: var(--text-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* تصميم مميز لخاصية إجمالي النقاط */
        .info-row.points-row {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            border-color: #7dd3fc;
        }

        .info-row.points-row .info-value {
            color: var(--deep-sky);
            font-size: 1.2rem;
        }

        /* زر إظهار/إخفاء كلمة السر الفخم */
        .btn-toggle-pass {
            background: var(--light-sky);
            color: var(--primary-sky);
            border: 1px solid var(--border-sky);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle-pass:hover {
            background: var(--primary-sky);
            color: white;
        }

        /* الشريط السفلي العائم للجوال */
        .bottom-nav {
            display: none; /* مخفي في اللابتوب ويظهر في الجوال */
        }

        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;
                background: #ffffff;
                justify-content: space-around;
                align-items: center;
                padding: 10px;
                border-top: 1px solid var(--border-sky);
                box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
                z-index: 1000;
            }

            .bottom-nav-item {
                text-decoration: none;
                color: #475569;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-size: 0.8rem;
                font-weight: 600;
                padding: 6px 10px;
                border-radius: 8px;
                transition: all 0.3s ease;
            }

            .bottom-nav-item:hover, 
            .bottom-nav-item.active {
                color: var(--primary-sky);
            }

            .bottom-nav-item.nav-btn-special {
                background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
                color: #ffffff !important;
                border-radius: 10px;
                box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
            }

            .account-container {
                padding: 20px;
            }
            .page-header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <div class="account-container">
        <!-- رأس الصفحة -->
        <div class="page-header">
            <h1>بيانات الحساب الرسمي</h1>
            <a href="dashboard.html" class="btn-back">الرئيسية</a>
        </div>

        <!-- حقل عرض البيانات المستخرجة -->
        <div class="info-card" id="accountDataBox">
            <!-- سيتم تعبئة البيانات تلقائياً هنا -->
        </div>
    </div>

    <!-- الشريط السفلي للجوال -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="bottom-nav-item" style="text-decoration: none;">
            <span>الرئيسية</span>
        </a>
        <a href="attendance.html" class="bottom-nav-item" style="text-decoration: none;">
            <span>الحضور</span>
        </a>
        <a href="statement.html" class="bottom-nav-item active" style="text-decoration: none;">
            <span>الحساب</span>
        </a>
        <a href="fdg.html" class="bottom-nav-item nav-btn-special" style="text-decoration: none;">
            <span>الدوري</span>
        </a>
        <a href="settings.html" class="bottom-nav-item" style="text-decoration: none;">
            <span>الإعدادات</span>
        </a>
    </div>

    <script>
        // جلب البيانات من الـ localStorage وعرضها مع تفعيل زر إظهار كلمة السر
        window.addEventListener('DOMContentLoaded', () => {
            const dataBox = document.getElementById('accountDataBox');

            const userName = localStorage.getItem('userName') || 'احمد محمد';
            const userGroup = localStorage.getItem('userGroup') || 'الأولى';
            const userPassword = localStorage.getItem('userPassword') || '12345678';
            const userPoints = localStorage.getItem('userPoints') || '535';

            dataBox.innerHTML = `
                <div class="info-row">
                    <span class="info-label">اسم الطالب:</span>
                    <span class="info-value">${userName}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">المجموعة:</span>
                    <span class="info-value">${userGroup}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">كلمة السر:</span>
                    <span class="info-value">
                        <span id="passText">••••••••</span>
                        <button class="btn-toggle-pass" onclick="togglePassword('${userPassword}')" id="toggleBtn">إظهار</button>
                    </span>
                </div>
                <div class="info-row points-row">
                    <span class="info-label">إجمالي النقاط:</span>
                    <span class="info-value">${userPoints} نقطة</span>
                </div>
            `;
        });

        // وظيفة إظهار وإخفاء كلمة السر عند الضغط على الزر
        let isPassVisible = false;
        function togglePassword(actualPassword) {
            const passText = document.getElementById('passText');
            const toggleBtn = document.getElementById('toggleBtn');

            if (!isPassVisible) {
                passText.textContent = actualPassword;
                toggleBtn.textContent = 'إخفاء';
                isPassVisible = true;
            } else {
                passText.textContent = '••••••••';
                toggleBtn.textContent = 'إظهار';
                isPassVisible = false;
            }
        }
    </script>

</body>
</html>
