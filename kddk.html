<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نادي اوتك | لوحة التكاليف والمهام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --surface-white: #ffffff;
            --primary-color: #0f172a;
            --accent-gold: #d97706;
            --accent-sky: #0284c7;
            --accent-sky-light: #f0f9ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-luxury: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
            --warning-bg: #fffbeb;
            --warning-border: #fef3c7;
            --warning-text: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* تنبيه التعهد الفخم */
        .alert-banner {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.7;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.04);
        }

        .alert-banner span.icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        /* رأس الصفحة الرسمي */
        .page-header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 5px;
        }

        /* شبكة البطاقات الفخمة */
        .assignments-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .assignment-card {
            background: var(--surface-white);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-luxury);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .assignment-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-sky);
            box-shadow: 0 20px 40px -10px rgba(2, 132, 199, 0.08);
        }

        /* شارة الحالة */
        .badge-status {
            position: absolute;
            top: 25px;
            left: 25px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .badge-pending {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #ffe4e6;
        }

        .assignment-title {
            font-size: 16.5px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 12px;
            line-height: 1.6;
            padding-left: 90px;
        }

        .assignment-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .assignment-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 18px;
        }

        .tag-type {
            background: var(--accent-sky-light);
            color: var(--accent-sky);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .tag-points {
            background: #fef3c7;
            color: #b45309;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .btn-submit-action {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .btn-submit-action:hover {
            background: var(--accent-sky);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.25);
        }

        /* نافذة التسليم التفاعلية (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--surface-white);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent-sky);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: var(--text-muted);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        .btn-confirm {
            background: var(--accent-sky);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 2;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .empty-state {
            background: var(--surface-white);
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 700;
            box-shadow: var(--shadow-luxury);
        }

        /* الجوال */
        @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .assignment-card { padding: 20px; }
            .assignment-title { font-size: 15px; padding-left: 0; margin-top: 35px; }
            .badge-status { top: 15px; left: 15px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 5px; }
            .assignment-footer { flex-direction: column; gap: 15px; align-items: stretch; }
            .btn-submit-action { text-align: center; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="main-container">


        <!-- رأس الصفحة -->
        <div class="page-header">
            <div>
                <div class="section-title">
                    <span></span> التكاليف  
                </div>
                <div class="section-subtitle">قائمة المهام والأنشطة الرسمية المطلوبة منك</div>
            </div>
        </div>

        <!-- حاوية بطاقات التكاليف -->
        <div class="assignments-grid" id="assignmentsContainer">
            <div class="empty-state">
                ⏳ جاري مزامنة وتحميل التكاليف من  رسيفر اوتك...
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة للتسليم -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-card">
            <div class="modal-title">📤 تسليم  </div>
            <form id="submissionForm" onsubmit="handleSubmission(event)">
                <input type="hidden" id="taskIdentifier">
                
                <div class="form-group">
                    <label class="form-label">   محتوى التسليم:</label>
                    <textarea class="form-control" id="taskText" placeholder="اكتب إجابتك أو ملاحظاتك هنا..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">إرفاق ملف (اختياري):</label>
                    <input type="file" class="form-control" id="taskFile">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn-confirm" id="submitBtnText">تسليم </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const studentData = JSON.parse(localStorage.getItem('studentData'));
        const studentCode = studentData ? String(studentData.code).trim() : null;
        let globalTasksList = [];

        if (!studentCode) {
            window.location.href = 'index.html';
        } else {
            fetchCSVAssignments();
        }

        function fetchCSVAssignments() {
            const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnq_ryhGDHxZYtbt5gqAXRIo2d0-IuXnD1ZsMlFX9u8AwpbRiLJdcHD5SbmnzXmMLBLr26qCupmGP8/pub?gid=1214163216&single=true&output=csv';

            fetch(csvUrl)
                .then(response => response.text())
                .then(data => {
                    parseAndRender(data);
                })
                .catch(error => {
                    console.error('خطأ بالاتصال:', error);
                    document.getElementById('assignmentsContainer').innerHTML = `
                        <div class="empty-state">⚠️ تعذر الاتصال بقاعدة البيانات. تأكد من اتصال الإنترنت.</div>
                    `;
                });
        }

        function parseAndRender(csvText) {
            const lines = csvText.split('\n');
            const container = document.getElementById('assignmentsContainer');
            container.innerHTML = '';
            globalTasksList = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                if (cols.length >= 3) {
                    const rowCode = cols[0] ? cols[0].replace(/"/g, '').trim() : '';
                    const rowDate = cols[1] ? cols[1].replace(/"/g, '').trim() : '';
                    const rowOperation = cols[2] ? cols[2].replace(/"/g, '').trim() : '';
                    const rowDetails = cols[3] ? cols[3].replace(/"/g, '').trim() : 'مهمة تكليف جديدة';
                    const rowPoints = cols[4] ? cols[4].replace(/"/g, '').trim() : '0';

                    if (rowCode === studentCode && (rowOperation.includes('تكليف') || rowOperation.includes('التكليف'))) {
                        globalTasksList.push({
                            date: rowDate,
                            operation: rowOperation,
                            details: rowDetails,
                            points: rowPoints
                        });
                    }
                }
            }

            if (globalTasksList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">🎉 ممتاز! لا توجد أي تكاليف جديدة مطلوبة منك في الوقت الحالي.</div>
                `;
                return;
            }

            globalTasksList.forEach((task, index) => {
                const cardHTML = `
                    <div class="assignment-card">
                        <div class="badge-status badge-pending">لم تسلم </div>
                        <div class="assignment-title">${task.details}</div>
                        <div class="assignment-meta">
                            <span>📅 تاريخ الإصدار: ${task.date || 'غير محدد'}</span>
                        </div>
                        <div class="assignment-footer">
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <span class="tag-type">${task.operation}</span>
                                <span class="tag-points">⭐ ${task.points} نقطة</span>
                            </div>
                            <button class="btn-submit-action" onclick="openSubmitModal(${index})">
                                تسليم 
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function openSubmitModal(index) {
            document.getElementById('taskIdentifier').value = index;
            document.getElementById('taskText').value = '';
            document.getElementById('taskFile').value = '';
            document.getElementById('submitModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('submitModal').style.display = 'none';
        }

        // إرسال العملية الجديدة وحذف صف التكليف القديم
        function handleSubmission(event) {
            event.preventDefault();
            const taskIdx = document.getElementById('taskIdentifier').value;
            const targetTask = globalTasksList[taskIdx];
            const textAnswer = document.getElementById('taskText').value.trim();
            const fileInput = document.getElementById('taskFile');
            
            let submissionContent = textAnswer;
            if (fileInput.files.length > 0) {
                submissionContent += (textAnswer ? ' | [ملف: ' : '[ملف: ') + fileInput.files[0].name + ']';
            }

            if (!submissionContent) {
                alert('الرجاء كتابة نص الإجابة أو إرفاق ملف قبل التأكيد.');
                return;
            }

            const btn = document.getElementById('submitBtnText');
            btn.innerText = 'جاري التسليم...';
            btn.disabled = true;

            const currentDate = new Date().toISOString().split('T')[0];
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxDPf1td2NwbWPCC2BgMUb1KY1BDqTkZawi3DXHNYk9Fk2TYAQ4k4elA4zIf0rPvPdh/exec';

            const payload = {
                action: "submitAndRemove",
                code: studentCode,                  // العمود A (للبحث والحذف)
                date: currentDate,                  // العمود B
                operation: "تم التسليم",             // العمود C
                points: targetTask.points,          // العمود D
                submission: submissionContent,      // العمود E
                taskDetails: targetTask.details     // مطابقة تفاصيل التكليف لحذفه بدقة
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('تم تسليم المهمة بنجاح');
                closeModal();
                btn.innerText = 'تسليم';
                btn.disabled = false;
                location.reload(); // تحديث الصفحة لتحديث القائمة
            })
            .catch(error => {
                console.error('خطأ في الإرسال:', error);
                alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
                btn.innerText = 'تسليم';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
